# Cluster standalone
spark.master                                   spark://spark-master:7077
spark.executor.memory                          1g
spark.executor.cores                           2
# 4 coeurs max par application : deux applications (ex. pipeline streaming + vérification) peuvent cohabiter
spark.cores.max                                4
spark.sql.shuffle.partitions                   6
spark.sql.session.timeZone                     UTC

# MinIO (S3A)
spark.hadoop.fs.s3a.endpoint                   http://minio:9000
spark.hadoop.fs.s3a.access.key                 minioadmin
spark.hadoop.fs.s3a.secret.key                 minioadmin123
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider   org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Delta Lake
spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog

# Journal d'événements -> Spark History Server (captures DAG après exécution)
spark.eventLog.enabled                         true
spark.eventLog.dir                             file:///opt/spark-events
spark.history.fs.logDirectory                  file:///opt/spark-events
